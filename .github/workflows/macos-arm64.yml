# Dispatch-only: run it by hand on a release candidate; prerelease.yml calls it at the release commit.
name: macOS arm64 native build

on:
  workflow_dispatch:
  workflow_call:   # prerelease.yml builds the delivery at the caller's exact commit (#59)

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native macOS arm64 build, tests, pluginval and auval
    # macos-15 defaults to Xcode 16.4, whose libc++ lacks std::jthread/stop_token used by the chemistry supervisor;
    # macos-26 ships Xcode 26 (Apple clang 21), matching the reference macOS toolchain.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Record runner identity
        run: |
          mkdir -p out/macos
          { sw_vers; uname -m; xcodebuild -version; clang --version; cmake --version; ninja --version || true; python3 --version; } | tee out/macos/runner-identity.txt
          [ "$(uname -s)" = Darwin ] && [ "$(uname -m)" = arm64 ]

      - name: Install Ninja and a NumPy venv on the hosted runner
        run: |
          command -v ninja >/dev/null || brew install ninja
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet numpy
          echo "$PWD/build/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/build/venv" >> "$GITHUB_ENV"
          { ninja --version; build/venv/bin/python3 -c 'import sys, numpy; print(sys.version); print("numpy", numpy.__version__)'; } | tee -a out/macos/runner-identity.txt

      - name: Configure, build and test mac-synth (chemistry OFF)
        run: |
          cmake --preset mac-synth
          cmake --build --preset mac-synth --parallel 4
          ctest --preset mac-synth --output-on-failure 2>&1 | tee out/macos/mac-synth-ctest.log

      - name: Configure and build mac-release (chemistry ON compile)
        run: |
          cmake --preset mac-release
          cmake --build --preset mac-release --parallel 4

      - name: Build pinned pluginval from source
        run: IUPAC_BUILD_JOBS=4 ./scripts/build-pluginval.sh

      - name: Validate VST3, AU, editor and Standalone
        run: ./scripts/macos-validate.sh build/mac-synth out/macos

      - name: Write artifact manifest
        run: |
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > out/macos/head-commit.txt
          (cd out/macos && find . -type f -print0 | sort -z | xargs -0 shasum -a 256 > ../macos-manifest.sha256)
          mv out/macos-manifest.sha256 out/macos/manifest.sha256
          cat out/macos/manifest.sha256

      - name: Upload retained macOS artifacts and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iupac-synth-2-macos-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: out/macos/
          if-no-files-found: error
          retention-days: 30

  delivery:
    name: Self-contained payload, bundle staging and installed V10 (macOS arm64)
    # #42. Ephemeral runner only: the clean-machine step deletes every removable
    # external Python/Java, which is why it is refused unless CI is true.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Record runner identity
        run: |
          [ "$(uname -s)" = Darwin ] && [ "$(uname -m)" = arm64 ]
          mkdir -p out/macos-delivery
          { sw_vers; uname -m; xcodebuild -version; clang --version; cmake --version; } | tee out/macos-delivery/runner-identity.txt

      - name: Install the pinned payload prerequisites
        run: |
          command -v ninja >/dev/null || brew install ninja
          brew install python@3.11 openjdk@17
          echo "PAYLOAD_PYTHON=$(brew --prefix python@3.11)/bin/python3.11" >> "$GITHUB_ENV"
          echo "PAYLOAD_JAVA_HOME=$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home" >> "$GITHUB_ENV"
          { "$(brew --prefix python@3.11)/bin/python3.11" --version
            "$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home/bin/java" -version 2>&1
          } | tee -a out/macos-delivery/runner-identity.txt

      - name: Build and verify the private chemistry payload
        run: |
          PYTHON="$PAYLOAD_PYTHON" JAVA_HOME="$PAYLOAD_JAVA_HOME" ./packaging/build-runtime-macos.sh
          cp out/iupac-chemistry-macos/package-report.json out/macos-delivery/package-report.json

      - name: Build and test mac-release with the payload interpreter, and pluginval
        # The payload venv, not a fresh one: the helper-dependent CTest cases run the
        # production helper, so they need the interpreter closure the payload pins.
        run: |
          export PATH="$PWD/build/package-macos/venv/bin:$PATH" VIRTUAL_ENV="$PWD/build/package-macos/venv"
          cmake --preset mac-release
          cmake --build --preset mac-release --parallel 4
          ctest --preset mac-release --output-on-failure 2>&1 | tee out/macos-delivery/mac-release-ctest.log
          IUPAC_BUILD_JOBS=4 ./scripts/build-pluginval.sh

      - name: Cross-platform V1 parity against the Linux arm64 expectations
        run: |
          ./tools/verify_panel_parity.py --cli build/mac-release/iupac-cli \
            --helper-root "$PWD/out/iupac-chemistry-macos" \
            --report out/macos-delivery/parity-report.json

      - name: Stage the complete product
        run: |
          ./packaging/stage-product-macos.sh build/mac-release out/iupac-chemistry-macos \
            "$RUNNER_TEMP/IUPAC Synth 2 macOS"
          cp "$RUNNER_TEMP/IUPAC Synth 2 macOS/install-report.json" out/macos-delivery/
          cp "$RUNNER_TEMP/IUPAC Synth 2 macOS/install-manifest.sha256" out/macos-delivery/
          cp "$RUNNER_TEMP/IUPAC Synth 2 macOS.tar.gz.sha256" out/macos-delivery/

      - name: Remove every removable external interpreter from the runner
        env:
          IUPAC_DESTRUCTIVE_RUNNER: '1'
        run: ./packaging/macos-clean-machine.sh out/macos-delivery/clean-machine-inventory.txt

      - name: Installed V10 analogue, network denied
        run: |
          ./packaging/test-verify-installed-macos.sh
          ./packaging/verify-installed-macos.sh "$RUNNER_TEMP/IUPAC Synth 2 macOS" \
            out/macos-delivery/v10-report.json
          cat out/macos-delivery/v10-report.json

      - name: Write artifact manifest
        run: |
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > out/macos-delivery/head-commit.txt
          (cd out/macos-delivery && find . -type f -print0 | sort -z | xargs -0 shasum -a 256 > ../macos-delivery-manifest.sha256)
          mv out/macos-delivery-manifest.sha256 out/macos-delivery/manifest.sha256
          cat out/macos-delivery/manifest.sha256

      - name: Upload retained delivery reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iupac-synth-2-macos-delivery-${{ github.event.pull_request.head.sha || github.sha }}
          path: out/macos-delivery/
          if-no-files-found: error
          retention-days: 30
