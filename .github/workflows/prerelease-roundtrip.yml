name: Pre-release round trip (download from Releases and re-verify)

# Called by prerelease.yml after publication, and dispatchable on its own for an existing tag.
# Downloads every asset with gh, checks SHA256SUMS, runs the product doctor and an offline name
# analysis on the Linux archive inside the minimal runtime image, re-checks the macOS archive bytes.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v2.0.0-preview.N); the commit is read from the tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  roundtrip:
    name: Linux minimal runtime and macOS archive bytes
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Record runner identity
        run: |
          mkdir -p out
          { uname -a; cat /etc/os-release; echo "runner=$RUNNER_NAME image=$ImageOS/$ImageVersion"; docker --version; gh --version; } | tee out/roundtrip-runner-identity.txt

      - name: Resolve the release commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          if [ -n "$SHA" ] && [ "$SHA" != "$tag_sha" ]; then echo "tag $TAG points at $tag_sha, not $SHA" >&2; exit 1; fi
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Download every asset and re-verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: ./scripts/prerelease-roundtrip.sh "$TAG" "$SHA" out/roundtrip

      - name: Retain round-trip evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prerelease-roundtrip-${{ inputs.tag }}-${{ steps.commit.outputs.sha }}
          path: |
            out/roundtrip/roundtrip-report.json
            out/roundtrip/linux-roundtrip.log
            out/roundtrip/release.json
            out/roundtrip-runner-identity.txt
          if-no-files-found: error
          retention-days: 90
