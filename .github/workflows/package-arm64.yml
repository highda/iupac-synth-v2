# Source-gated CI: runs only for pull requests touching source or packaging paths.
# Docs-only and script-only changes never trigger it.
name: Linux arm64 private runtime package
on:
  workflow_dispatch:
  workflow_call:   # prerelease.yml builds the delivery at the caller's exact commit (#59)
  pull_request:
    paths: ["src/**", "include/**", "tests/**", "tools/**", "chemistry/**", "data/**", "cmake/**", "CMakeLists.txt", "CMakePresets.json", "third_party/**", "packaging/**", ".github/workflows/package-arm64.yml"]
concurrency:
  group: package-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Build pinned Debian payload and runtime image
        run: docker build --platform linux/arm64 --target runtime -t iupac-runtime:test -f packaging/Dockerfile .
      - name: Run isolated clean-runtime proof
        run: |
          mkdir -p out
          chmod 0777 out
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --user 65534:65534 -v "$PWD/out:/reports" iupac-runtime:test \
            /opt/iupac-chemistry /reports/clean-runtime-report.json
      - name: Export retained package and reports
        run: docker build --platform linux/arm64 --target export --output type=local,dest=out -f packaging/Dockerfile .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iupac-chemistry-linux-arm64-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Build complete installed product
        run: docker build --platform linux/arm64 --target runtime -t iupac-product:test -f packaging/ProductDockerfile .
      - name: V10 installed formats in isolated minimal runtime
        run: |
          chmod 0777 out
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --user 65534:65534 -v "$PWD/out:/reports" iupac-product:test \
            '/opt/IUPAC Synth 2' /reports/v10-report.json
      - name: Export exact tested delivery
        run: |
          mkdir -p out/product
          docker build --platform linux/arm64 --target export --output type=local,dest=out/product -f packaging/ProductDockerfile .
          (cd out/product && sha256sum -c 'IUPAC Synth 2.tar.gz.sha256')
          artifact_sha=$(sha256sum 'out/product/IUPAC Synth 2.tar.gz' | cut -d ' ' -f 1)
          printf '{"schemaVersion":1,"commit":"%s","testedBy":"v10-report.json","archive":"IUPAC Synth 2.tar.gz","sha256":"%s"}\n' \
            '${{ github.event.pull_request.head.sha || github.sha }}' "$artifact_sha" > out/delivery-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iupac-synth-2-linux-arm64-${{ github.sha }}
          path: |
            out/product/
            out/v10-report.json
            out/delivery-report.json
          if-no-files-found: error
          retention-days: 30
